data_processed_root: data_processed
sample_rate: 44100
clip_seconds: 5.0
clips_per_epoch: 64
val_clips: 16
val_fraction: 0.1
split_seed: 0
batch_size: 4
lr: 0.0003
num_epochs: 2
checkpoint_dir: checkpoints_smoke
log_dir: runs_smoke
device: auto
checkpoint_every: 1
# Parallel data-loading workers. Keep 0 on macOS/MPS (deadlocks observed);
# raise to e.g. 4 on Linux/CUDA machines.
num_workers: 0
# Anchor the main-array/room/tree stems (union of both datasets' naming
# conventions) so the smoke test exercises the anchor path too.
anchors:
  "*_L": 0
  "*_C": 45
  "*_R": 90
  "*_RoomL": 0
  "*_RoomR": 90
  "Tree_L": 0
  "Tree_R": 90
